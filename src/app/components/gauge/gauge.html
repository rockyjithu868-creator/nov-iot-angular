<div class="gauge-card"
  [class.alarm-hi]="alarmState==='hi'"
  [class.alarm-lo]="alarmState==='lo'">
  <div class="gauge-tag">{{ tag }}</div>
  @if (alarmState) {
    <div class="alarm-badge">{{ alarmState === 'hi' ? 'HIGH' : 'LOW' }}</div>
  }
  <svg width="120" height="70" viewBox="0 0 120 70" style="display:block;margin:0 auto 6px">
    <path [attr.d]="bgPath" fill="none" stroke="#1e2d42" stroke-width="8" stroke-linecap="round"/>
    @if (arcPath) {
      <path [attr.d]="arcPath" fill="none" [attr.stroke]="color" stroke-width="8" stroke-linecap="round"/>
    }
  </svg>
  <div class="gauge-value">{{ value }}<span class="gauge-unit">{{ unit }}</span></div>
</div>
